name: release

# Push a tag like v0.1.0 to publish. PyPI must trust this workflow first
# (trusted publishing: project mrfkit, workflow release.yml, environment pypi).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/mrfkit/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
